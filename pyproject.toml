[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lanchat-socket"
version = "0.0.0"
description = "HCMUS LAN Chat & File Sharing socket programming assignment (scaffold)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["prompt_toolkit>=3.0,<4"]

[tool.setuptools.packages.find]
include = ["lanchat*"]
